# from https://discourse.julialang.org/t/easy-workflow-file-for-setting-up-github-actions-ci-for-your-julia-package/49765

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # The full suite takes ~10 min locally; 60 stops a genuine hang burning the
    # 6h default. Note this does not cover queue time, which has its own 24h limit.
    timeout-minutes: 60
    # Informational rows that must not turn the workflow red:
    #   nightly  - unreleased Julia, breaks for reasons unrelated to this package
    #              (LoopVectorization 0.12 in particular)
    #   rosetta  - x86 Julia under Rosetta on Apple Silicon, unsupported
    continue-on-error: ${{ matrix.version == 'nightly' || matrix.rosetta == true }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.9' # Replace this with the minimum Julia version that your package supports. E.g. if your package requires Julia 1.5 or higher, change this to '1.5'.
          - '1.10'
          - '1' # Leave this line unchanged. '1' will automatically expand to the latest stable 1.x release of Julia.
          - 'nightly'
        os: [ubuntu-latest, windows-latest]
        arch: [x64]
        include:
          # Apple Silicon must be covered natively: LoopVectorization generates
          # different code on aarch64, and produced silently wrong reductions
          # here (see the loss fix in v0.3.0) that x86-only CI never caught.
          # `macos-latest` runners are aarch64; pairing them with arch: x64
          # only tests x86 Julia under Rosetta.
          - os: macos-latest
            arch: aarch64
            version: '1'
          - os: macos-latest
            arch: aarch64
            version: '1.10'
          # No macos-13 row: GitHub's Intel macOS runner capacity is shrinking and
          # jobs sit in the queue until the 24h limit cancels them. Native x86_64 is
          # already covered by ubuntu-latest and windows-latest.
          # Informational only, never blocking (see continue-on-error below):
          # macos-latest is Apple Silicon, so arch: x64 runs x86 Julia under
          # Rosetta. Rosetta does not implement AVX and LoopVectorization emits
          # an illegal instruction in `ℓ`. This configuration is unsupported;
          # the row is kept so we notice if it ever starts working.
          - os: macos-latest
            arch: x64
            version: '1'
            rosetta: true
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info
